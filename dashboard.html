<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectScout – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --schwarz:    #0a0a0a;
  --dunkel:     #0f1318;
  --karte:      #161b22;
  --karte2:     #1c2128;
  --rand:       #21262d;
  --rand2:      #30363d;
  --text:       #e6edf3;
  --text-dim:   #8b949e;
  --text-dimmer:#4a5568;
  --gold:       #d4a017;
  --gold-hell:  #f0c040;
  --gold-dim:   rgba(212,160,23,0.15);
  --gruen:      #238636;
  --gruen-hell: #2ea043;
  --gruen-dim:  rgba(35,134,54,0.15);
  --rot:        #da3633;
  --rot-dim:    rgba(218,54,51,0.15);
  --blau:       #388bfd;
  --blau-dim:   rgba(56,139,253,0.15);
  --lila:       #8957e5;
  --lila-dim:   rgba(137,87,229,0.15);
  --orange:     #e3b341;
  --orange-dim: rgba(227,179,65,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--schwarz);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HINTERGRUND GRID */
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(212,160,23,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,160,23,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* LAYOUT */
.layout { position: relative; z-index: 1; display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 260px; min-width: 260px;
  background: var(--dunkel);
  border-right: 1px solid var(--rand);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--rand);
}
.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 3px; color: var(--gold);
}
.logo-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--text-dimmer);
  text-transform: uppercase; letter-spacing: 1px;
  margin-top: 2px;
}

.sidebar-section { padding: 16px 20px 8px; }
.sidebar-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--text-dimmer);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 8px;
}

/* Filter Checkboxen */
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 4px; cursor: pointer;
  transition: background 0.15s;
  font-size: 13px; color: var(--text-dim);
  user-select: none;
}
.filter-item:hover { background: var(--karte); color: var(--text); }
.filter-item input[type=checkbox] { display: none; }
.filter-dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--rand2); flex-shrink: 0;
  transition: all 0.15s;
}
.filter-item.aktiv .filter-dot { border-color: var(--gold); background: var(--gold); }
.filter-item.aktiv { color: var(--text); }

.filter-count {
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--text-dimmer);
  background: var(--karte2); padding: 1px 6px; border-radius: 10px;
}

.sidebar-divider { height: 1px; background: var(--rand); margin: 8px 20px; }

/* Läufe-Liste */
.lauf-item {
  margin: 4px 12px; padding: 10px 12px;
  border-radius: 4px; cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.lauf-item:hover { background: var(--karte); border-color: var(--rand); }
.lauf-item.aktiv { background: var(--gold-dim); border-color: var(--gold); }
.lauf-datum {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--text-dimmer);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.lauf-titel { font-size: 12px; color: var(--text); margin-top: 2px; }
.lauf-anzahl {
  font-size: 11px; color: var(--gold);
  margin-top: 2px; font-weight: 600;
}

/* HAUPTBEREICH */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* HEADER */
.header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--rand);
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
  background: var(--dunkel);
  position: sticky; top: 0; z-index: 100;
}
.header-titel { flex: 1; min-width: 200px; }
.header-firma {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 2px; color: var(--text);
}
.header-meta {
  font-size: 12px; color: var(--text-dim); margin-top: 2px;
}

.header-stats { display: flex; gap: 16px; }
.stat-box {
  text-align: center; padding: 8px 16px;
  background: var(--karte); border: 1px solid var(--rand);
  border-radius: 4px; min-width: 80px;
}
.stat-zahl {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 1px; color: var(--gold);
  line-height: 1;
}
.stat-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: var(--text-dimmer);
  text-transform: uppercase; letter-spacing: 1px;
  margin-top: 2px;
}

.btn-excel {
  display: flex; align-items: center; gap: 8px;
  background: var(--gruen); color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600; font-size: 13px;
  padding: 10px 18px; border-radius: 3px;
  border: none; cursor: pointer;
  transition: background 0.15s; white-space: nowrap;
}
.btn-excel:hover { background: var(--gruen-hell); }
.btn-excel svg { width: 16px; height: 16px; }

/* TABS */
.tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--rand);
  padding: 0 28px;
  background: var(--dunkel);
}
.tab {
  padding: 12px 20px;
  font-size: 13px; font-weight: 500;
  color: var(--text-dim); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.aktiv { color: var(--gold); border-bottom-color: var(--gold); }

/* CONTENT BEREICH */
.content { flex: 1; padding: 24px 28px; }

/* KARTE */
.karte-container {
  background: var(--karte);
  border: 1px solid var(--rand);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 24px;
  height: 420px;
  position: relative;
}
#karte { width: 100%; height: 100%; }
.karte-overlay {
  position: absolute; top: 12px; left: 12px; z-index: 1000;
  background: rgba(10,10,10,0.85);
  border: 1px solid var(--rand);
  border-radius: 4px; padding: 8px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--text-dim);
}

/* PROJEKT LISTE */
.projekte-liste { display: flex; flex-direction: column; gap: 10px; }

.projekt-karte {
  background: var(--karte);
  border: 1px solid var(--rand);
  border-radius: 6px;
  padding: 16px 20px;
  display: flex; gap: 16px; align-items: flex-start;
  transition: all 0.2s; cursor: pointer;
  position: relative;
  overflow: hidden;
}
.projekt-karte::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--gold);
  opacity: 0;
  transition: opacity 0.2s;
}
.projekt-karte:hover { border-color: var(--rand2); background: var(--karte2); }
.projekt-karte:hover::before { opacity: 1; }
.projekt-karte.ignoriert { opacity: 0.4; }
.projekt-karte.ignoriert::before { background: var(--text-dimmer); opacity: 1; }

.relevanz-badge {
  flex-shrink: 0;
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; letter-spacing: 1px;
  position: relative;
}
.rel-hoch  { background: var(--gruen-dim); color: var(--gruen-hell); border: 1px solid var(--gruen); }
.rel-mittel { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold); }
.rel-niedrig { background: var(--rot-dim); color: var(--rot); border: 1px solid var(--rot); }

.projekt-body { flex: 1; min-width: 0; }
.projekt-titel {
  font-size: 15px; font-weight: 600; color: var(--text);
  margin-bottom: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.projekt-meta {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 8px;
}
.tag {
  font-family: 'DM Mono', monospace;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 2px 8px; border-radius: 2px;
}
.tag-kat  { background: var(--blau-dim);   color: var(--blau); }
.tag-phase { background: var(--lila-dim);  color: var(--lila); }
.tag-bl   { background: var(--karte2);     color: var(--text-dim); border: 1px solid var(--rand); }
.tag-vol  { background: var(--orange-dim); color: var(--orange); }

.projekt-beschreibung {
  font-size: 13px; color: var(--text-dim); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}

.projekt-actions {
  display: flex; flex-direction: column; gap: 6px;
  align-items: flex-end; flex-shrink: 0;
}
.btn-link {
  font-size: 12px; color: var(--gold);
  text-decoration: none; white-space: nowrap;
  padding: 4px 8px; border-radius: 3px;
  border: 1px solid var(--gold-dim);
  transition: all 0.15s;
}
.btn-link:hover { background: var(--gold-dim); }
.btn-ignorieren {
  font-size: 11px; color: var(--text-dimmer);
  background: none; border: 1px solid var(--rand);
  padding: 4px 8px; border-radius: 3px;
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.btn-ignorieren:hover { color: var(--rot); border-color: var(--rot); }
.btn-ignorieren.aktiv { color: var(--gruen-hell); border-color: var(--gruen); }

.projekt-ort {
  font-size: 12px; color: var(--text-dimmer);
  margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}

/* LEER-STATE */
.leer-state {
  text-align: center; padding: 80px 20px;
  color: var(--text-dimmer);
}
.leer-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.leer-text { font-size: 15px; }

/* LADE-ANIMATION */
.laden {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 60px; color: var(--text-dim);
}
.laden-dots { display: flex; gap: 4px; }
.laden-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: bounce 1.2s infinite;
}
.laden-dots span:nth-child(2) { animation-delay: 0.2s; }
.laden-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,60%,100% { opacity:0.3; transform:scale(1); }
  30% { opacity:1; transform:scale(1.4); }
}

/* SUCHLEISTE */
.suchleiste {
  display: flex; gap: 10px; margin-bottom: 16px;
  align-items: center;
}
.such-input {
  flex: 1; background: var(--karte);
  border: 1px solid var(--rand); border-radius: 4px;
  padding: 9px 14px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  outline: none; transition: border-color 0.15s;
}
.such-input::placeholder { color: var(--text-dimmer); }
.such-input:focus { border-color: var(--gold); }

.sort-select {
  background: var(--karte); border: 1px solid var(--rand);
  border-radius: 4px; padding: 9px 12px;
  color: var(--text); font-family: 'DM Mono', monospace;
  font-size: 11px; outline: none; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.sort-select:focus { border-color: var(--gold); }

/* KEIN JS FALLBACK */
#tab-liste, #tab-karte { display: none; }
#tab-liste.aktiv, #tab-karte.aktiv { display: block; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .header { padding: 16px; }
  .content { padding: 16px; }
  .tabs { padding: 0 16px; }
}
</style>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ============================================================
// KONFIGURATION
// ============================================================
const SUPABASE_URL = 'https://bkhjekpwyngoixnlizxo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w9k4Lrm0ddpg1yMsgx4ZUg__djz3JIt';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// STATE
// ============================================================
let alleProjekte    = [];
let alleAuftraege   = [];
let aktiverAuftrag  = null;
let karteInstanz    = null;
let karteMarker     = [];
let aktiveFilter    = { kategorie: new Set(), phase: new Set(), bundesland: new Set() };
let ignoriertIds    = new Set();

// ============================================================
// URL PARAMETER
// ============================================================
const params       = new URLSearchParams(window.location.search);
const kundenId     = params.get('kunden_id');
const suchanfrageId = params.get('suchanfrage_id');

// ============================================================
// INIT
// ============================================================
async function init() {
  if (!kundenId) {
    zeigeKeinZugang();
    return;
  }
  await ladeDaten();
}

async function ladeDaten() {
  try {
    // Kundendaten
    const { data: kunde } = await supabase
      .from('kunden').select('*').eq('id', kundenId).single();

    if (kunde) {
      document.getElementById('header-firma').textContent = kunde.firmenname || 'Dashboard';
    }

    // Alle Suchanfragen dieses Kunden
    const { data: auftraege } = await supabase
      .from('suchanfragen')
      .select('*')
      .eq('kunden_id', kundenId)
      .eq('status', 'abgeschlossen')
      .order('erstellt_am', { ascending: false });

    alleAuftraege = auftraege || [];
    rendereAuftraege();

    // Aktiven Auftrag bestimmen
    if (suchanfrageId) {
      aktiverAuftrag = alleAuftraege.find(a => a.id === suchanfrageId) || alleAuftraege[0];
    } else {
      aktiverAuftrag = alleAuftraege[0];
    }

    if (aktiverAuftrag) {
      await ladeProjekte(aktiverAuftrag.id);
    } else {
      document.getElementById('projekte-liste').innerHTML =
        '<div class="leer-state"><div class="leer-icon">🔍</div><div class="leer-text">Noch keine abgeschlossenen Scout-Läufe vorhanden.</div></div>';
      document.getElementById('header-firma').textContent = kunde?.firmenname || 'Dashboard';
      aktualisiereStats([]);
    }

  } catch (e) {
    console.error('Ladefehler:', e);
  }
}

async function ladeProjekte(auftragId) {
  const { data: projekte } = await supabase
    .from('projekte')
    .select('*')
    .eq('suchanfrage_id', auftragId)
    .order('relevanz', { ascending: false });

  alleProjekte = projekte || [];

  // Ignorierte IDs laden
  ignoriertIds = new Set(alleProjekte.filter(p => p.ignorieren).map(p => p.id));

  // Header-Meta
  if (aktiverAuftrag) {
    const datum = new Date(aktiverAuftrag.erstellt_am).toLocaleDateString('de-AT', {
      day: '2-digit', month: '2-digit', year: 'numeric'
    });
    const bl = Array.isArray(aktiverAuftrag.bundeslaender)
      ? aktiverAuftrag.bundeslaender.join(', ')
      : (aktiverAuftrag.ganz_oesterreich ? 'Ganz Österreich' : '–');
    document.getElementById('header-meta').textContent =
      `Scout-Lauf vom ${datum} · ${bl}`;
  }

  aktualisiereStats(alleProjekte);
  baueFilter(alleProjekte);
  rendereListe();
  aktualisiereKarte();
}

// ============================================================
// STATS
// ============================================================
function aktualisiereStats(projekte) {
  const sichtbar = projekte.filter(p => !p.ignorieren);
  document.getElementById('stat-gesamt').textContent = sichtbar.length;
  document.getElementById('stat-neu').textContent =
    sichtbar.filter(p => {
      const d = new Date(p.erstmals_gefunden);
      return (Date.now() - d.getTime()) < 7 * 24 * 60 * 60 * 1000;
    }).length;
  document.getElementById('stat-hoch').textContent =
    sichtbar.filter(p => (p.relevanz || 0) >= 8).length;
}

// ============================================================
// FILTER AUFBAUEN
// ============================================================
function baueFilter(projekte) {
  const kategorien  = [...new Set(projekte.map(p => p.kategorie).filter(Boolean))].sort();
  const phasen      = [...new Set(projekte.map(p => p.phase).filter(Boolean))].sort();
  const bundeslaender = [...new Set(projekte.map(p => p.bundesland).filter(Boolean))].sort();

  baueFilterGruppe('filter-kategorie', kategorien, 'kategorie', projekte);
  baueFilterGruppe('filter-phase',     phasen,     'phase',      projekte);
  baueFilterGruppe('filter-bundesland', bundeslaender, 'bundesland', projekte);
}

function baueFilterGruppe(containerId, werte, filterKey, projekte) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  werte.forEach(wert => {
    const anzahl = projekte.filter(p => p[filterKey] === wert && !p.ignorieren).length;
    const item = document.createElement('div');
    item.className = 'filter-item';
    item.dataset.wert = wert;
    item.dataset.key = filterKey;
    item.innerHTML = `
      <div class="filter-dot"></div>
      <span>${wert}</span>
      <span class="filter-count">${anzahl}</span>`;
    item.addEventListener('click', () => toggleFilter(filterKey, wert, item));
    container.appendChild(item);
  });
}

function toggleFilter(key, wert, element) {
  if (aktiveFilter[key].has(wert)) {
    aktiveFilter[key].delete(wert);
    element.classList.remove('aktiv');
  } else {
    aktiveFilter[key].add(wert);
    element.classList.add('aktiv');
  }
  rendereListe();
  aktualisiereKarte();
}

function gefilterteProjekte() {
  const suche = (document.getElementById('suche')?.value || '').toLowerCase();
  return alleProjekte.filter(p => {
    if (aktiveFilter.kategorie.size > 0 && !aktiveFilter.kategorie.has(p.kategorie)) return false;
    if (aktiveFilter.phase.size > 0 && !aktiveFilter.phase.has(p.phase)) return false;
    if (aktiveFilter.bundesland.size > 0 && !aktiveFilter.bundesland.has(p.bundesland)) return false;
    if (suche) {
      const text = `${p.titel} ${p.ort} ${p.beschreibung} ${p.kategorie}`.toLowerCase();
      if (!text.includes(suche)) return false;
    }
    return true;
  });
}

// ============================================================
// LISTE RENDERN
// ============================================================
function rendereListe() {
  const container = document.getElementById('projekte-liste');
  const sortierung = document.getElementById('sortierung')?.value || 'relevanz';
  let projekte = gefilterteProjekte();

  if (sortierung === 'relevanz') projekte.sort((a,b) => (b.relevanz||0)-(a.relevanz||0));
  else if (sortierung === 'datum') projekte.sort((a,b) => new Date(b.erstmals_gefunden)-new Date(a.erstmals_gefunden));
  else if (sortierung === 'ort') projekte.sort((a,b) => (a.ort||'').localeCompare(b.ort||''));

  if (projekte.length === 0) {
    container.innerHTML = '<div class="leer-state"><div class="leer-icon">🔍</div><div class="leer-text">Keine Projekte gefunden – Filter anpassen?</div></div>';
    return;
  }

  container.innerHTML = projekte.map(p => projektKarteHTML(p)).join('');

  // Ignorieren-Buttons Events
  container.querySelectorAll('.btn-ignorieren').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      await toggleIgnorieren(id, btn);
    });
  });
}

function projektKarteHTML(p) {
  const rel = p.relevanz || 0;
  const relKlasse = rel >= 8 ? 'rel-hoch' : rel >= 5 ? 'rel-mittel' : 'rel-niedrig';
  const ignoriert = ignoriertIds.has(p.id);

  return `
  <div class="projekt-karte ${ignoriert ? 'ignoriert' : ''}" id="pk-${p.id}">
    <div class="relevanz-badge ${relKlasse}">${rel}</div>
    <div class="projekt-body">
      <div class="projekt-titel">${escHtml(p.titel || '–')}</div>
      <div class="projekt-meta">
        ${p.kategorie ? `<span class="tag tag-kat">${escHtml(p.kategorie)}</span>` : ''}
        ${p.phase     ? `<span class="tag tag-phase">${escHtml(p.phase)}</span>` : ''}
        ${p.bundesland? `<span class="tag tag-bl">${escHtml(p.bundesland)}</span>` : ''}
        ${p.volumen   ? `<span class="tag tag-vol">${escHtml(p.volumen)}</span>` : ''}
      </div>
      <div class="projekt-beschreibung">${escHtml(p.beschreibung || '')}</div>
      <div class="projekt-ort">📍 ${escHtml(p.ort || '')}${p.bezirk ? ' · ' + escHtml(p.bezirk) : ''}</div>
    </div>
    <div class="projekt-actions">
      ${p.artikel_url ? `<a href="${escHtml(p.artikel_url)}" target="_blank" class="btn-link">→ Artikel</a>` : ''}
      <button class="btn-ignorieren ${ignoriert ? 'aktiv' : ''}" data-id="${p.id}">
        ${ignoriert ? '✓ Ignoriert' : 'Ignorieren'}
      </button>
    </div>
  </div>`;
}

// ============================================================
// IGNORIEREN
// ============================================================
async function toggleIgnorieren(projektId, btn) {
  const neuIgnoriert = !ignoriertIds.has(projektId);
  await supabase.from('projekte')
    .update({ ignorieren: neuIgnoriert })
    .eq('id', projektId);

  if (neuIgnoriert) {
    ignoriertIds.add(projektId);
    btn.textContent = '✓ Ignoriert';
    btn.classList.add('aktiv');
    document.getElementById(`pk-${projektId}`)?.classList.add('ignoriert');
  } else {
    ignoriertIds.delete(projektId);
    btn.textContent = 'Ignorieren';
    btn.classList.remove('aktiv');
    document.getElementById(`pk-${projektId}`)?.classList.remove('ignoriert');
  }
  aktualisiereStats(alleProjekte);
}

// ============================================================
// KARTE (OpenStreetMap via Leaflet – kein API Key!)
// ============================================================
function aktualisiereKarte() {
  if (!karteInstanz) {
    karteInstanz = L.map('karte', { zoomControl: true }).setView([47.5, 14.0], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 18,
    }).addTo(karteInstanz);

    // Dunkles Overlay für bessere Optik
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© CartoDB',
      maxZoom: 19,
    }).addTo(karteInstanz);
  }

  // Alte Marker entfernen
  karteMarker.forEach(m => m.remove());
  karteMarker = [];

  const projekte = gefilterteProjekte().filter(p => !p.ignorieren);
  let mitKoords = 0;

  // Geocoding: Ort → Koordinaten (via Nominatim, kostenlos)
  // Wir laden Koordinaten asynchron
  projekte.forEach(async (p) => {
    if (!p.ort) return;
    try {
      const suchterm = encodeURIComponent(`${p.ort}, Österreich`);
      const resp = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${suchterm}&format=json&limit=1&countrycodes=at`,
        { headers: { 'Accept-Language': 'de' } }
      );
      const data = await resp.json();
      if (!data[0]) return;

      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);

      // Farbiger Marker je nach Relevanz
      const rel = p.relevanz || 0;
      const farbe = rel >= 8 ? '#238636' : rel >= 5 ? '#d4a017' : '#da3633';

      const markerIcon = L.divIcon({
        className: '',
        html: `<div style="
          width:14px;height:14px;border-radius:50%;
          background:${farbe};border:2px solid rgba(255,255,255,0.6);
          box-shadow:0 0 6px ${farbe};cursor:pointer;
        "></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7],
      });

      const marker = L.marker([lat, lon], { icon: markerIcon }).addTo(karteInstanz);
      marker.bindPopup(`
        <div style="font-family:'DM Sans',sans-serif;min-width:200px;">
          <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">
            ${p.kategorie || ''} · Relevanz ${rel}/10
          </div>
          <div style="font-weight:600;font-size:14px;margin-bottom:6px;">${escHtml(p.titel || '')}</div>
          <div style="font-size:12px;color:#666;margin-bottom:8px;">📍 ${escHtml(p.ort || '')}</div>
          ${p.artikel_url
            ? `<a href="${escHtml(p.artikel_url)}" target="_blank"
               style="color:#d4a017;font-size:12px;font-weight:600;">
               → Zum Artikel
             </a>`
            : ''}
        </div>
      `, { maxWidth: 280 });

      karteMarker.push(marker);
      mitKoords++;
      document.getElementById('karte-overlay').textContent =
        `${mitKoords} Projekte auf Karte`;

    } catch(e) { /* Geocoding-Fehler ignorieren */ }
  });

  document.getElementById('karte-overlay').textContent =
    `${projekte.length} Projekte werden geladen...`;
}

// ============================================================
// SCOUT-LÄUFE IN SIDEBAR
// ============================================================
function rendereAuftraege() {
  const container = document.getElementById('laufe-liste');
  if (!alleAuftraege.length) {
    container.innerHTML = '<div style="padding:8px 20px;font-size:12px;color:var(--text-dimmer);">Noch keine Läufe</div>';
    return;
  }
  container.innerHTML = alleAuftraege.map(a => {
    const datum = new Date(a.erstellt_am).toLocaleDateString('de-AT', {
      day:'2-digit', month:'2-digit', year:'numeric'
    });
    const bl = Array.isArray(a.bundeslaender)
      ? a.bundeslaender.join(', ')
      : (a.ganz_oesterreich ? 'Ganz Österreich' : '–');
    const istAktiv = aktiverAuftrag?.id === a.id;
    return `
    <div class="lauf-item ${istAktiv ? 'aktiv' : ''}" onclick="wechsleLauf('${a.id}')">
      <div class="lauf-datum">${datum}</div>
      <div class="lauf-titel">${escHtml(bl)}</div>
    </div>`;
  }).join('');
}

window.wechsleLauf = async function(auftragId) {
  aktiverAuftrag = alleAuftraege.find(a => a.id === auftragId);
  aktiveFilter = { kategorie: new Set(), phase: new Set(), bundesland: new Set() };
  document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('aktiv'));
  await ladeProjekte(auftragId);
  rendereAuftraege();
};

// ============================================================
// EXCEL EXPORT
// ============================================================
window.exportiereExcel = function() {
  const projekte = gefilterteProjekte();
  if (!projekte.length) { alert('Keine Projekte zum Exportieren.'); return; }

  const zeilen = projekte.map(p => ({
    'Titel':        p.titel || '',
    'Ort':          p.ort || '',
    'Bezirk':       p.bezirk || '',
    'Bundesland':   p.bundesland || '',
    'Kategorie':    p.kategorie || '',
    'Phase':        p.phase || '',
    'Volumen':      p.volumen || '',
    'Relevanz':     p.relevanz || '',
    'Quelle':       p.quelle || '',
    'Artikel URL':  p.artikel_url || '',
    'Beschreibung': p.beschreibung || '',
    'Gefunden am':  p.erstmals_gefunden ? new Date(p.erstmals_gefunden).toLocaleDateString('de-AT') : '',
    'Ignoriert':    p.ignorieren ? 'Ja' : 'Nein',
  }));

  const ws = XLSX.utils.json_to_sheet(zeilen);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ProjectScout Projekte');

  // Spaltenbreiten
  ws['!cols'] = [
    {wch:40},{wch:20},{wch:20},{wch:15},{wch:15},
    {wch:15},{wch:15},{wch:10},{wch:20},{wch:50},{wch:60},{wch:15},{wch:10}
  ];

  const datum = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `ProjectScout_${datum}.xlsx`);
};

// ============================================================
// TABS
// ============================================================
window.zeigeTab = function(tab, element) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('aktiv'));
  document.querySelectorAll('#tab-liste, #tab-karte').forEach(t => t.classList.remove('aktiv'));
  element.classList.add('aktiv');
  document.getElementById(`tab-${tab}`).classList.add('aktiv');

  if (tab === 'karte') {
    setTimeout(() => {
      if (karteInstanz) karteInstanz.invalidateSize();
      else aktualisiereKarte();
    }, 100);
  }
};

// ============================================================
// HILFSFUNKTIONEN
// ============================================================
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function zeigeKeinZugang() {
  document.body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;
      font-family:'DM Sans',sans-serif;background:#0a0a0a;color:#e6edf3;text-align:center;padding:40px;">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:#d4a017;letter-spacing:4px;">PROJECTSCOUT</div>
        <div style="color:#8b949e;margin-top:16px;font-size:16px;">
          Kein Zugang – bitte verwenden Sie den Link aus Ihrer E-Mail.
        </div>
        <a href="index.html" style="display:inline-block;margin-top:24px;background:#d4a017;
          color:#0a0a0a;padding:12px 28px;border-radius:3px;font-weight:600;text-decoration:none;">
          → Neuen Scout-Lauf starten
        </a>
      </div>
    </div>`;
}

// ============================================================
// START – Event Listeners (alles hier, kein onclick im HTML)
// ============================================================
document.addEventListener('DOMContentLoaded', () => {

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('aktiv'));
      document.querySelectorAll('#tab-liste, #tab-karte').forEach(t => t.classList.remove('aktiv'));
      tab.classList.add('aktiv');
      document.getElementById(`tab-${name}`).classList.add('aktiv');
      if (name === 'karte') {
        setTimeout(() => {
          if (karteInstanz) karteInstanz.invalidateSize();
          else aktualisiereKarte();
        }, 100);
      }
    });
  });

  // Excel Button
  document.getElementById('btn-excel')?.addEventListener('click', exportiereExcel);

  // Suche
  document.getElementById('suche')?.addEventListener('input', rendereListe);

  // Sortierung
  document.getElementById('sortierung')?.addEventListener('change', rendereListe);

});

init();
</script>
