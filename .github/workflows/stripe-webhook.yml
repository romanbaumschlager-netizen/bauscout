name: ProjectScout Agent

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      suchanfrage_id:
        description: 'Suchanfrage ID (optional – leer = alle offenen)'
        required: false
        type: string

jobs:
  neue-auftraege-pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests anthropic

      - name: ProjectScout Agent starten
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          SUCHANFRAGE_ID:      ${{ github.event.inputs.suchanfrage_id }}
        run: python agent/agent.py

      - name: Zusammenfassung
        if: always()
        run: |
          echo "## ProjectScout Agent Run" >> $GITHUB_STEP_SUMMARY
          echo "**Zeitpunkt:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Nächster Check:** in 15 Minuten" >> $GITHUB_STEP_SUMMARY
