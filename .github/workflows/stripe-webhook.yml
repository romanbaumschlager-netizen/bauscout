name: BauScout Agent Starter

on:
  # Alle 15 Minuten prüfen ob neue bezahlte Aufträge da sind
  schedule:
    - cron: '*/15 * * * *'
  
  # Auch manuell testbar
  workflow_dispatch:
    inputs:
      suchanfrage_id:
        description: 'Suchanfrage ID (optional – leer = alle offenen)'
        required: false
        type: string

jobs:
  neue-auftraege-pruefen:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Neue bezahlte Aufträge suchen und starten
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 << 'PYTHON'
          import os, requests, json
          from datetime import datetime

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SECRET_KEY']
          spezifische_id = "${{ github.event.inputs.suchanfrage_id }}"

          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Content-Type': 'application/json',
          }

          # Bezahlte aber noch nicht gestartete Aufträge suchen
          if spezifische_id:
              filter_url = f"{url}/rest/v1/suchanfragen?id=eq.{spezifische_id}&select=*"
          else:
              filter_url = f"{url}/rest/v1/suchanfragen?status=eq.bezahlt&select=*"

          resp = requests.get(filter_url, headers=headers)
          auftraege = resp.json()

          if not auftraege:
              print("Keine neuen bezahlten Aufträge gefunden.")
              exit(0)

          print(f"{len(auftraege)} neuer Auftrag/Aufträge gefunden!")

          for auftrag in auftraege:
              sid = auftrag['id']
              print(f"\n→ Starte Auftrag: {sid}")
              print(f"  Gewerke: {auftrag.get('gewerke', [])}")
              print(f"  Bundesländer: {auftrag.get('bundeslaender', [])}")
              print(f"  Zeitraum: {auftrag.get('zeitraum_tage', 30)} Tage")

              # Status auf 'agent_laeuft' setzen
              requests.patch(
                  f"{url}/rest/v1/suchanfragen?id=eq.{sid}",
                  headers={**headers, 'Prefer': 'return=minimal'},
                  json={'status': 'agent_laeuft'}
              )

              print(f"  ✅ Status → agent_laeuft")
              print(f"  → Agent-Code folgt im nächsten Sprint")

          PYTHON

      - name: Zusammenfassung
        run: |
          echo "## BauScout Agent Check" >> $GITHUB_STEP_SUMMARY
          echo "**Zeitpunkt:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Nächster Check:** in 15 Minuten" >> $GITHUB_STEP_SUMMARY
