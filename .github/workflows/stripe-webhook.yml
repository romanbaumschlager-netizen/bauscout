name: ProjectScout Agent

# Nur EIN Agent-Lauf gleichzeitig: Ein neuer 15-Minuten-Takt wartet, bis der
# gerade laufende Lauf fertig ist, statt parallel zu starten.
# 'cancel-in-progress: false' heißt ausdrücklich: ein laufender Lauf wird NICHT
# abgebrochen. Das verhindert Doppelbearbeitung und macht den automatischen
# Wiederanlauf abgestürzter Aufträge eindeutig.
concurrency:
  group: projectscout-agent
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      suchanfrage_id:
        description: 'Suchanfrage ID (optional – leer = alle offenen)'
        required: false
        type: string
jobs:
  neue-auftraege-pruefen:
    runs-on: ubuntu-latest
    # Muss immer ~15 Min UEBER dem ZEITBUDGET_MINUTEN-Wert unten liegen, damit
    # der Agent sauber finalisieren kann (E-Mail + Status), bevor GitHub den
    # Job hart abbricht.
    timeout-minutes: 175
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Abhängigkeiten installieren
        run: pip install requests anthropic beautifulsoup4 pdfplumber curl_cffi
      - name: ProjectScout Agent starten
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          # WICHTIG: Ohne diese Zeile sieht agent.py den Brevo-Schlüssel nicht
          # und überspringt Kunden-Ergebnismail + Admin-Benachrichtigung.
          BREVO_API_KEY:       ${{ secrets.BREVO_API_KEY }}
          # Obergrenze für die Suchphase in Minuten. Kleine Aufträge (1-2
          # Bundesländer) enden von selbst viel früher – das Budget greift nur
          # bei Großaufträgen (z.B. ganz Österreich), die bisher bei 45 Min
          # abgeschnitten wurden.
          ZEITBUDGET_MINUTEN:  "160"
          # Säule C (meinbezirk direkt auslesen) testweise aktivieren:
          # nächste Zeile einkommentieren, einen Lauf mit der Test-Suchanfrage
          # starten und im Log die [meinbezirk]-Diagnose prüfen.
          # REGIO_AKTIV:         "1"
          SUCHANFRAGE_ID:      ${{ github.event.inputs.suchanfrage_id }}
        run: python agent/agent.py
      - name: Zusammenfassung
        if: always()
        run: |
          echo "## ProjectScout Agent Run" >> $GITHUB_STEP_SUMMARY
          echo "**Zeitpunkt:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Nächster Check:** in 15 Minuten" >> $GITHUB_STEP_SUMMARY
