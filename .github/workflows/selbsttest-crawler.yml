name: Crawler-Selbsttest (kostenlos, ohne KI)

on:
  workflow_dispatch:
    inputs:
      breite_pro_bl:
        description: "Gemeinden je Bundesland (Stichprobe, read-only, ohne KI)"
        required: false
        default: "30"

jobs:
  crawler-test:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Crawler-Breitentest ausfuehren
        env:
          BREITE_PRO_BL: ${{ inputs.breite_pro_bl }}
        run: python agent/crawler.py
